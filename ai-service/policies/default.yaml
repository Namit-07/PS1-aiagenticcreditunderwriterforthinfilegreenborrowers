# Default underwriting policy profile (Team B).
version: "1.0"
profile: default

limits:
  foir_max: 0.50
  ltv_max: 0.80
  min_age: 21
  max_tenure_months: 60

confidence:
  income_min: 0.60
  overall_min: 0.55

mismatch:
  income_tolerance: 0.02
  human_review_mismatch_threshold: 1

flags:
  require_kyc: true
  require_bank_statement: true
  require_dealer_invoice: true
  require_platform_earnings: true